<body>
<div class="container">

  <!-- BOUTON PARTAGER -->
  <button class="share-btn" onclick="shareSite()"><i class="fa-solid fa-share-nodes"></i></button>

  <!-- HEADER -->
  <img src="photo.jpg" alt="DJ DAMELO" class="logo">
  <div class="header">
    <h1>DJ DAMELO</h1>
    <p>Artiste - Chanteur - Producteur</p>
    <p>DJ Officiel <span class="flags">🇹🇬 🇬🇭</span></p>
  </div>

  <!-- DIAPORAMA 6 PHOTOS -->
  <div class="slideshow-container">
    <!-- 1. Plaque Gold -->
    <div class="mySlides fade">
      <img src="images/gold.jpg" style="width:100%; display:block;">
      <div class="text">CERTIFIÉ GOLD & PLATINUM</div>
    </div>

    <!-- 2. Toi -->
    <div class="mySlides fade">
      <img src="images/moi.jpg" style="width:100%; display:block;">
      <div class="text">DJ DAMELO</div>
    </div>

    <!-- 3. Pochette -->
    <div class="mySlides fade">
      <img src="images/pochette.jpg" style="width:100%; display:block;">
      <div class="text">RICHE OU PAUVRE - 980M STREAMS</div>
    </div>

    <!-- 4. Singing -->
    <div class="mySlides fade">
      <img src="images/singing.jpg" style="width:100%; display:block;">
      <div class="text">EN STUDIO</div>
    </div>

    <!-- 5. Neige -->
    <div class="mySlides fade">
      <img src="images/neige.jpg" style="width:100%; display:block;">
      <div class="text">TOUR MONDIAL</div>
    </div>

    <!-- 6. Logo -->
    <div class="mySlides fade">
      <img src="images/logo.jpg" style="width:100%; display:block;">
      <div class="text">DJ DAMELO OFFICIEL</div>
    </div>

    <!-- Flèches -->
    <a class="prev" onclick="plusSlides(-1)">❮</a>
    <a class="next" onclick="plusSlides(1)">❯</a>

    <!-- Points -->
    <div style="text-align:center; padding:10px; background:#000;">
      <span class="dot" onclick="currentSlide(1)"></span>
      <span class="dot" onclick="currentSlide(2)"></span>
      <span class="dot" onclick="currentSlide(3)"></span>
      <span class="dot" onclick="currentSlide(4)"></span>
      <span class="dot" onclick="currentSlide(5)"></span>
      <span class="dot" onclick="currentSlide(6)"></span>
    </div>
  </div>

  <!-- ICI TU COLLES LA CARD DES 2 SONS + PACK -->
  <!-- ICI TU COLLES LA CARD DES RESEAUX -->

</div> <!-- FIN CONTAINER -->

<!-- CSS MANQUANT A AJOUTER DANS <style> DU HEAD -->
<style>
.share-btn {
  position: fixed; top: 15px; right: 15px; z-index: 1000;
  background: rgba(0,0,0,0.6); color: white; border: none;
  border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer;
}
.slideshow-container { max-width: 900px; position: relative; margin: 30px auto; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 25px rgba(255,165,0,0.4); }
.mySlides { display: none; }
.text { color: #fff; font-size: 15px; padding: 8px 12px; position: absolute; bottom: 8px; width: 100%; text-align: center; background: rgba(0,0,0,0.6); }
.prev,.next { cursor: pointer; position: absolute; top: 50%; width: auto; padding: 16px; margin-top: -22px; color: white; font-weight: bold; font-size: 18px; transition: 0.6s ease; border-radius: 0 3px 3px 0; background: rgba(0,0,0,0.4); }
.next { right: 0; border-radius: 3px 0 0 3px; }
.prev:hover,.next:hover { background: rgba(0,0,0,0.8); }
.dot { cursor: pointer; height: 12px; width: 12px; margin: 0 3px; background-color: #bbb; border-radius: 50%; display: inline-block; transition: background-color 0.6s ease; }
.active,.dot:hover { background-color: #FF8C00; }
.fade { animation-name: fade; animation-duration: 1.5s; }
@keyframes fade { from {opacity:.4} to {opacity: 1} }
</style>

<!-- SCRIPT MANQUANT A METTRE AVANT </body> -->
<script>
// PARTAGE
function shareSite() {
  if (navigator.share) {
    navigator.share({
      title: 'DJ DAMELO - Gold Certified Artist',
      text: 'Découvre DJ Damelo - 980M+ Streams',
      url: window.location.href
    }).catch(err => console.log('Erreur partage', err));
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Lien du site copié! 📋 Colle-le pour partager');
  }
}

// DIAPORAMA
let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n) { showSlides(slideIndex += n); }
function currentSlide(n) { showSlides(slideIndex = n); }

function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
  for (i = 0; i < dots.length; i++) { dots[i].className = dots[i].className.replace(" active", ""); }
  slides[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " active";
}

// LANCER AUTO TOUTES LES 4s
setInterval(() => { plusSlides(1); }, 4000);
</script>

</body>
</html>
